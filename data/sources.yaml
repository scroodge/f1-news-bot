# Website scrape sources — config-driven, no code changes to add a source.
#
# Fields per source:
#   name              display name (also used in health tracking)
#   list_url          the news-listing page to scan for article links
#   link_pattern      substring an article URL path must contain
#   exclude_patterns  path substrings that mark non-article pages (categories, pagination)
#   enabled           set false to turn a source off without deleting it
#   max_articles      cap of new articles fetched per run (politeness)
#
# The scraper respects robots.txt, sends a descriptive User-Agent, waits
# between article fetches, and auto-disables a source after repeated failures.
# English original reporting preferred. RSS sources live in src/config.py.
# Listing URLs checked on 2026-10-26; robots.txt is checked at runtime.

scrape_sources:
  - name: formula1.com
    list_url: https://www.formula1.com/en/latest/all
    link_pattern: /en/latest/article/
    enabled: true
    max_articles: 10

  - name: the-race.com
    list_url: https://www.the-race.com/category/formula-1/
    link_pattern: /formula-1/
    exclude_patterns: ["/category/", "/page/", "/results/", "-race-results", "-race-result/", "-qualifying-results", "/what-time-"]
    enabled: true
    max_articles: 15

  - name: racingnews365.com
    list_url: https://racingnews365.com/interview
    link_pattern: /exclusive-
    enabled: true
    max_articles: 10

  - name: planetf1.com
    list_url: https://www.planetf1.com/news
    link_pattern: /news/
    exclude_patterns: ["/page/"]
    enabled: true
    max_articles: 5

  # Collected through working RSS feeds instead; avoid duplicate scrape traffic.
  - name: autosport.com
    list_url: https://www.autosport.com/f1/news/
    link_pattern: /f1/news/
    enabled: false
    max_articles: 5

  - name: motorsport.com
    list_url: https://www.motorsport.com/f1/news/
    link_pattern: /f1/news/
    enabled: false
    max_articles: 5
