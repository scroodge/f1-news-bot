<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>F1 News — мадэрацыя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-fg: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: -apple-system, system-ui, Roboto, sans-serif;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 12px 16px 10px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
  }
  .head-row { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
  .head-badge { font-size: 13px; font-weight: 600; color: var(--btn-fg); background: var(--btn); padding: 3px 10px; border-radius: 20px; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; padding: 10px 6px; border: 0; border-radius: var(--radius-sm); text-align: center;
    background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all .2s ease-out;
  }
  .tab.active { background: var(--btn); color: var(--btn-fg); }
  .tab:active { transform: scale(.96); }
  .sub-tabs { display: flex; gap: 4px; margin-top: 8px; padding: 0 16px; }
  .sub-tab {
    flex: 1; padding: 8px 8px; border: 0; border-radius: 8px; text-align: center;
    background: transparent; color: var(--hint); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .2s ease-out; position: relative;
  }
  .sub-tab.active { background: var(--card); color: var(--fg); font-weight: 600; }
  .sub-tab:active { transform: scale(.96); }
  main { padding: 12px 16px; display: grid; gap: 14px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    display: grid; gap: 12px; transition: opacity .3s ease-out;
    box-shadow: 0 1px 3px color-mix(in srgb, var(--fg) 4%, transparent);
  }
  .card-img { width: 100%; aspect-ratio: 2/1; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 2px; background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .preview { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.55; }
  .preview img { display: none; }
  .preview-collapsed { position: relative; }
  .preview-collapsed::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2em; background: linear-gradient(transparent, var(--card)); }
  .expand-btn { background: none; border: 0; color: var(--link); font-size: 13px; cursor: pointer; padding: 4px 0; text-align: left; }
  .expand-btn:active { opacity: .6; }
  .loading-overlay {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 32px 16px; text-align: center;
  }
  .loading-overlay .spinner {
    width: 32px; height: 32px; border: 3px solid color-mix(in srgb, var(--btn) 20%, transparent);
    border-top-color: var(--btn); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .loading-overlay .step {
    font-size: 12px; color: var(--hint); display: flex; align-items: center; gap: 6px;
  }
  .loading-overlay .step.active { color: var(--fg); font-weight: 500; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { font-size: 13px; color: var(--hint); display: flex; flex-wrap: wrap; gap: 3px 14px; }
  .meta span { display: inline-flex; align-items: center; gap: 3px; }
  .row { display: flex; gap: 8px; }
  button.action {
    flex: 1; padding: 13px 8px; border: 0; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s ease-out;
    background: var(--btn); color: var(--btn-fg); -webkit-tap-highlight-color: transparent;
  }
  button.action:active { transform: scale(.96); }
  button.action:disabled { opacity: .4; transform: none; }
  button.ghost { background: var(--bg); color: var(--fg); border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); font-weight: 500; }
  button.ghost:active { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  button.danger { background: #e74c3c; color: #fff; }
  button.danger.ghost { background: transparent; color: #e74c3c; border-color: #e74c3c; }
  button.danger.ghost:active { background: color-mix(in srgb, #e74c3c 8%, transparent); }
  button.pill { border-radius: 20px; padding: 8px 16px; flex: 0 1 auto; font-size: 12px; }
  .editor { display: none; gap: 8px; padding-top: 4px; }
  .editor.open { display: grid; }
  .editor label { font-size: 11px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .4px; }
  .editor input, .editor textarea {
    width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; outline: none;
    transition: border-color .2s ease-out;
  }
  .editor input:focus, .editor textarea:focus { border-color: var(--btn); }
  .editor textarea { min-height: 80px; resize: vertical; }
  .empty { text-align: center; color: var(--hint); padding: 50px 16px; font-size: 15px; line-height: 1.6; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    background: var(--card); border-radius: var(--radius-sm); padding: 14px; text-align: center;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 3%, transparent);
  }
  .stat b { display: block; font-size: 24px; font-weight: 700; }
  .stat span { font-size: 12px; color: var(--hint); display: block; margin-top: 2px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--fg); color: var(--bg); padding: 10px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; z-index: 100;
    transition: all .25s cubic-bezier(.22,1,.36,1); white-space: nowrap;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--fg) 20%, transparent);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .histitem {
    background: var(--card); border-radius: var(--radius-sm); padding: 12px 14px;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 3%, transparent);
  }
  .histitem .t { font-size: 15px; font-weight: 500; }
  .histitem .m { font-size: 13px; color: var(--hint); margin-top: 4px; }
  .orig-toggle {
    background: none; border: 1px solid color-mix(in srgb, var(--hint) 30%, transparent); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; color: var(--hint); cursor: pointer;
    width: 100%; text-align: left; transition: all .2s ease-out; display: flex; align-items: center; gap: 6px;
  }
  .orig-toggle:hover { border-color: var(--hint); }
  .orig-toggle:active { transform: scale(.98); }
  .orig-content {
    display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.22,1,.36,1);
    margin-top: 0;
  }
  .orig-content.open { grid-template-rows: 1fr; }
  .orig-content > div {
    overflow: hidden;
  }
  .orig-inner {
    padding: 12px; border-radius: var(--radius-sm); margin-top: 6px;
    background: color-mix(in srgb, var(--fg) 4%, transparent);
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    border: 1px solid color-mix(in srgb, var(--fg) 6%, transparent);
  }
  .orig-inner b { font-weight: 600; }
  .bulk-bar {
    display: flex; gap: 8px; align-items: center;
  }
  .pill-reject {
    padding: 8px 16px; border: 0; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
    background: color-mix(in srgb, #e74c3c 10%, transparent); color: #e74c3c; transition: all .15s ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  .pill-reject:active { transform: scale(.96); }
  .count-chip {
    font-size: 11px; color: var(--hint); font-weight: 500; margin-left: auto;
  }
  @media (prefers-color-scheme: dark) {
    .stat b { color: var(--fg); }
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>F1 News</h1>
    <span class="head-badge">мадэрацыя</span>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="queue">Чарга <span id="queue-count"></span></button>
    <button class="tab" data-tab="published">Гісторыя</button>
    <button class="tab" data-tab="stats">Статыстыка</button>
  </div>
</header>
<main id="content"><div class="empty">Загрузка…</div></main>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const AUTH = tg?.initData ? { "Authorization": "tma " + tg.initData } : {};
const API = "/admin/api";
let activeTab = "queue";
let queueSubTab = "raw";
let editingId = null;

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

async function call(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...AUTH, ...(options.headers || {}) },
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || ("HTTP " + response.status));
  }
  return response.json();
}

const esc = (s) => (s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// --- raw-item card ----------------------------------------------------------

function rawCardHtml(item) {
  const img = item.image_url ? `<img class="card-img" src="${esc(item.image_url)}" loading="lazy" onerror="this.remove()">` : "";
  const snippet = (item.content || "").length > 400 ? item.content.slice(0, 400) + "..." : item.content;
  const collapsed = `📰 ${item.title}\n\n${snippet}\n\n🔗 ${item.url}`;
  const full = `📰 ${item.title}\n\n${item.content}\n\n🔗 ${item.url}`;
  const isLong = item.content && item.content.length > 400;
  return `
  <div class="card" data-id="${item.id}">
    ${img}
    <div class="preview"><div class="preview-collapsed" id="p-${item.id}">${esc(collapsed)}</div>${isLong ? '<button class="expand-btn" data-act="expand-preview" data-target="p-'+item.id+'" data-full="'+esc(full)+'">📖 Паказаць цалкам</button>' : ''}</div>
    <div class="meta">
      <span>📥 ${esc(item.source)}</span>
      <span>🎯 ${item.relevance_score.toFixed(2)}</span>
      <span>🌐 ${esc(item.original_language || "?")}</span>
    </div>
    <div class="row">
      <button class="action" data-act="translate">🌐 Перакласці</button>
      <button class="action danger ghost" data-act="reject" style="flex:0 0 44px">✕</button>
    </div>
  </div>`;
}

// --- processed-item card ----------------------------------------------------

function processedCardHtml(item) {
  const usage = item.llm_usage || {};
  const usageLine = usage.prompt_tokens != null
    ? `🪙 ${usage.prompt_tokens}+${usage.completion_tokens}`
    : "";
  const img = item.image_url ? `<img class="card-img" src="${esc(item.image_url)}" loading="lazy" onerror="this.remove()">` : "";
  return `
  <div class="card" data-id="${item.id}">
    ${img}
    <div class="preview"><div class="preview-collapsed" id="pp-${item.id}">${esc(item.preview)}</div><button class="expand-btn" data-act="expand-preview" data-target="pp-${item.id}">📖 Паказаць цалкам</button></div>
    <div class="meta">
      <span>📥 ${esc(item.source)}</span>
      <span>⭐ ${item.importance_level}/5</span>
      <span>🎯 ${item.relevance_score.toFixed(2)}</span>
      <span>🌐 ${esc(item.original_language || "?")}</span>
      ${usageLine ? `<span>${usageLine}</span>` : ""}
    </div>
    <button class="orig-toggle" data-act="toggle-original">📄 Арыгінал</button>
    <div class="orig-content" id="orig-${item.id}">
      <div><div class="orig-inner"><b>${esc(item.title)}</b>\n\n${esc(item.original_content || "")}</div></div>
    </div>
    <div class="editor" id="edit-${item.id}">
      <label>Загаловак</label>
      <input name="title_be" value="${esc(item.title_be || "")}">
      <label>Тэкст</label>
      <textarea name="summary">${esc(item.summary || "")}</textarea>
      <label>Галоўнае (радок на пункт)</label>
      <textarea name="key_points" rows="3">${esc((item.key_points || []).join("\n"))}</textarea>
      <label>Тэгі (праз коску)</label>
      <input name="tags" value="${esc((item.tags || []).join(", "))}">
      <div class="row">
        <button class="action" data-act="save">Захаваць</button>
        <button class="action ghost" data-act="generate-keypoints">🔑 Галоўнае</button>
        <button class="action ghost" data-act="cancel" style="flex:0 0 60px">Скасаваць</button>
      </div>
    </div>
    <div class="row">
      <button class="action" data-act="approve">✅ Публікаваць</button>
      <button class="action ghost" data-act="edit">✏️</button>
      <button class="action danger ghost" data-act="reject" style="flex:0 0 44px">✕</button>
    </div>
    <button class="action ghost" data-act="translate" style="font-size:12px">🌐 Пераперакласці</button>
  </div>`;
}

// --- queue rendering ---------------------------------------------------------

let rawQueueData = null;
let processedQueueData = null;

function renderSubTabs() {
  return `
    <div class="sub-tabs">
      <button class="sub-tab ${queueSubTab === "raw" ? "active" : ""}" data-subtab="raw">Новыя${rawQueueData ? ` (${rawQueueData.total})` : ""}</button>
      <button class="sub-tab ${queueSubTab === "processed" ? "active" : ""}" data-subtab="processed">На модэрацыі${processedQueueData ? ` (${processedQueueData.total})` : ""}</button>
    </div>`;
}

async function renderQueue() {
  const el = document.getElementById("content");
  try {
    const [rawData, processedData] = await Promise.all([
      call("/queue/raw"),
      call("/queue"),
    ]);
    rawQueueData = rawData;
    processedQueueData = processedData;

    const totalCount = (rawData.total || 0) + (processedData.total || 0);
    const badge = document.getElementById("queue-count");
    badge.textContent = totalCount ? `(${totalCount})` : "";

    let html = renderSubTabs();

    if (queueSubTab === "raw") {
      if (!rawData.items.length) {
        html += `<div class="empty">Новых навін няма</div>`;
      } else {
        html += `<div class="bulk-bar"><button class="pill-reject" data-act="reject-all-raw">✕ Выдаліць усе (${rawData.total})</button></div>`;
        html += rawData.items.map(rawCardHtml).join("");
      }
    } else {
      if (!processedData.items.length) {
        html += `<div class="empty">Чарга мадэрацыі пустая</div>`;
      } else {
        html += processedData.items.map(processedCardHtml).join("");
      }
    }

    el.innerHTML = html;

    if (editingId) {
      const editor = document.getElementById("edit-" + editingId);
      if (editor) editor.classList.add("open");
    }
  } catch (e) {
    el.innerHTML = `<div class="empty">Памылка: ${esc(e.message)}</div>`;
  }
}

// --- history & stats ---------------------------------------------------------

async function renderPublished() {
  const el = document.getElementById("content");
  const data = await call("/published");
  el.innerHTML = data.items.length
    ? data.items.map(i => `
      <div class="histitem">
        <div class="t">${esc(i.title_be || i.title)}</div>
        <div class="m">${i.published_to_channel_at ? new Date(i.published_to_channel_at).toLocaleString("be") : "—"} · ${esc(i.source)}</div>
      </div>`).join("")
    : `<div class="empty">Пакуль нічога не апублікавана</div>`;
}

async function renderStats() {
  const el = document.getElementById("content");
  const d = await call("/stats");
  const by = d.stats.by_status || {};
  el.innerHTML = `
    <div class="statgrid">
      <div class="stat"><b>${d.pending}</b><span>чакаюць</span></div>
      <div class="stat"><b>${d.queued}</b><span>на публікацыю</span></div>
      <div class="stat"><b>${d.stats.published_today}</b><span>сёння</span></div>
      <div class="stat"><b>${d.stats.published_this_week}</b><span>за тыдзень</span></div>
      <div class="stat"><b>${d.published_last_hour}/${d.max_posts_per_hour}</b><span>ліміт/гадз</span></div>
      <div class="stat"><b>${d.stats.total_collected}</b><span>сабрана</span></div>
      <div class="stat"><b>${by.rejected || 0}</b><span>адхілена</span></div>
      <div class="stat"><b>${by.collected || 0}</b><span>чакаюць</span></div>
    </div>`;
}

// --- action handlers ---------------------------------------------------------

async function handleAction(id, act, card) {
  const editor = card.querySelector(".editor");

  if (act === "edit") {
    editor.classList.toggle("open");
    editingId = editor.classList.contains("open") ? id : null;
    return;
  }
  if (act === "cancel") {
    editor.classList.remove("open");
    editingId = null;
    return;
  }

  if (act === "save") {
    const kpRaw = editor.querySelector('[name="key_points"]').value;
    const body = {
      title_be: editor.querySelector('[name="title_be"]').value,
      summary: editor.querySelector('[name="summary"]').value,
      key_points: kpRaw.split("\n").map(t => t.trim()).filter(Boolean),
      tags: editor.querySelector('[name="tags"]').value.split(",").map(t => t.trim()).filter(Boolean),
    };
    const updated = await call(`/items/${id}/edit`, { method: "POST", body: JSON.stringify(body) });
    card.outerHTML = processedCardHtml(updated);
    toast("Захавана");
    tg?.HapticFeedback?.notificationOccurred("success");
    return;
  }

  if (act === "approve" || act === "reject") {
    if (act === "reject" && !confirm("Адхіліць навіну?")) return;
    await call(`/items/${id}/${act}`, { method: "POST" });
    card.style.opacity = ".35"; card.style.pointerEvents = "none";
    toast(act === "approve" ? "У чарзе на публікацыю" : "Адхілена");
    tg?.HapticFeedback?.notificationOccurred(act === "approve" ? "success" : "warning");
    setTimeout(renderQueue, 600);
    return;
  }

  if (act === "translate") {
    card.style.opacity = "1"; card.style.pointerEvents = "none";
    card.innerHTML = `
      <div class="loading-overlay">
        <div class="spinner"></div>
        <div class="step" id="step1">⏳ Пераклад (TranslateGemma…)</div>
        <div class="step" id="step2">⏳ Паліроўка (Sonnet…)</div>
        <div class="step" id="step3">⏳ Аналіз (Claude…)</div>
      </div>`;
    const s = (id, active) => { const e = document.getElementById(id); if (e) e.className = "step" + (active ? " active" : ""); };
    s("step1", true);
    const t1 = setTimeout(() => { s("step1", false); s("step2", true); }, 35000);
    const t2 = setTimeout(() => { s("step2", false); s("step3", true); }, 55000);
    try {
      const updated = await call(`/items/${id}/translate`, { method: "POST" });
      clearTimeout(t1); clearTimeout(t2);
      toast("Пераклад гатовы");
      tg?.HapticFeedback?.notificationOccurred("success");
      if (queueSubTab === "raw") {
        await renderQueue();
      } else {
        card.outerHTML = processedCardHtml(updated);
        editingId = null;
      }
    } catch (e) {
      clearTimeout(t1); clearTimeout(t2);
      card.innerHTML = `
        <div style="text-align:center;padding:24px 16px;color:var(--hint)">
          <div style="font-size:28px;margin-bottom:8px">⚠️</div>
          <div style="font-size:14px;margin-bottom:12px">Памылка: ${esc(e.message)}</div>
          <button class="action ghost" data-act="translate" style="display:inline-block;flex:none;padding:8px 20px">Паўтарыць</button>
        </div>`;
      card.style.pointerEvents = "auto";
    }
    return;
  }

  if (act === "generate-keypoints") {
    if (editor && editor.classList.contains("open")) {
      await call(`/items/${id}/edit`, {
        method: "POST",
        body: JSON.stringify({
          title_be: editor.querySelector('[name="title_be"]').value,
          summary: editor.querySelector('[name="summary"]').value,
          tags: editor.querySelector('[name="tags"]').value.split(",").map(t => t.trim()).filter(Boolean),
        }),
      });
    }
    card.style.opacity = ".5"; card.style.pointerEvents = "none";
    try {
      const updated = await call(`/items/${id}/generate-keypoints`, { method: "POST" });
      card.outerHTML = processedCardHtml(updated);
      const newEditor = document.getElementById("edit-" + id);
      if (newEditor) { newEditor.classList.add("open"); editingId = id; }
      toast("Ключавыя пункты згенераваны");
      tg?.HapticFeedback?.notificationOccurred("success");
    } catch (e) {
      card.style.opacity = "1"; card.style.pointerEvents = "auto";
      toast("Памылка: " + e.message);
    }
    return;
  }
}

// --- wiring ------------------------------------------------------------------

const renderers = { queue: renderQueue, published: renderPublished, stats: renderStats };

async function show(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  document.getElementById("content").innerHTML = `<div class="empty">Загрузка…</div>`;
  try { await renderers[tab](); }
  catch (e) { document.getElementById("content").innerHTML = `<div class="empty">Памылка: ${esc(e.message)}</div>`; }
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab")?.dataset.tab;
  if (tab) show(tab);
});

document.getElementById("content").addEventListener("click", (e) => {
  const subTab = e.target.closest(".sub-tab")?.dataset.subtab;
  if (subTab && activeTab === "queue") {
    queueSubTab = subTab;
    renderQueue();
  }
});

document.getElementById("content").addEventListener("click", async (e) => {
  const button = e.target.closest("button[data-act]");
  if (!button) return;
  try {
    if (button.dataset.act === "toggle-original") {
      const content = button.nextElementSibling;
      if (content) content.classList.toggle("open");
      return;
    }
    if (button.dataset.act === "expand-preview") {
      const target = document.getElementById(button.dataset.target);
      if (target) {
        if (target.classList.contains("preview-collapsed")) {
          if (button.dataset.full) {
            target.innerHTML = button.dataset.full;
          }
          target.classList.remove("preview-collapsed");
          button.textContent = "📖 Схаваць";
        } else {
          target.classList.add("preview-collapsed");
          button.textContent = "📖 Паказаць цалкам";
        }
      }
      return;
    }
    button.disabled = true;
    if (button.dataset.act === "reject-all-raw") {
      if (!confirm("Выдаліць усе новыя навіны?")) return;
      const result = await call("/queue/raw/reject-all", { method: "POST" });
      toast("Выдалена " + result.count);
      tg?.HapticFeedback?.notificationOccurred("warning");
      await renderQueue();
    } else {
      const card = button.closest(".card");
      if (!card) return;
      await handleAction(card.dataset.id, button.dataset.act, card);
    }
  }
  catch (err) { toast("Памылка: " + err.message); }
  finally { button.disabled = false; }
});

show("queue");
setInterval(() => {
  if (activeTab === "queue") renderQueue().catch(() => {});
}, 60000);
</script>
</body>
</html>
