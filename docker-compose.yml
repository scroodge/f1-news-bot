# One compose file for local and VPS use.
#
# Local:  services read .env; postgres is NOT started (profile "vps") —
#         DATABASE_URL points at the Contabo DB through the SSH tunnel.
# VPS:    docker compose --profile vps up -d --build
#         .env sets DATABASE_URL=postgresql://f1_user:...@postgres:5432/f1_news
#
# The LLM is remote (dev.offtech.by / Anthropic API) — no Ollama container.

name: f1-news-bot

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dedicated PostgreSQL — VPS only (profile "vps").
  # Bound to 127.0.0.1:5433 on the host: reachable via SSH tunnel, not the internet.
  postgres:
    image: postgres:17-alpine
    container_name: f1-news-postgres
    profiles: ["vps"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-f1_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-f1_news}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1_user} -d ${POSTGRES_DB:-f1_news}"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Main app: collection + AI processing + API + Mini App
  f1-news-main:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      # localhost only — nginx terminates TLS and proxies to this port
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "start_local.py"]

  # Moderation bot + publisher loop
  f1-news-telegram:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      f1-news-main:
        condition: service_started
    command: ["python", "telegram_bot_standalone.py"]

volumes:
  redis_data:
  postgres_data:
